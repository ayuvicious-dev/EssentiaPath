/* ---------------- drag untuk ubah urutan langkah di folder ---------------- */
var reorderDragging = false;
var reorderPendingRender = false;

async function commitStepOrder(visibleIds){
  const user = auth.currentUser;
  const queue = getFolderQueue(currentFolder);
  const known = new Set(queue.map(([id]) => id));
  const vis = visibleIds.filter(id => known.has(id));
  const visSet = new Set(vis);
  const ids = queue.map(([id]) => id);
  const slots = [];
  queue.forEach(([id], i) => { if(visSet.has(id)) slots.push(i); });
  if(slots.length !== vis.length){ renderAll(); return; }
  // langkah selesai (tersembunyi) tetap di posisinya; langkah terlihat mengisi slot sesuai urutan baru
  slots.forEach((qi, j) => { ids[qi] = vis[j]; });
  const writes = [];
  ids.forEach((id, i) => {
    const data = localTimers.get(id);
    if(!data) return;
    if(data.order !== i + 1){
      data.order = i + 1;
      if(user) writes.push(updateDoc(doc(db, 'users', user.uid, 'timers', id), { order: i + 1 }));
    }
  });
  renderAll();
  try{ await Promise.all(writes); }catch(err){ console.error(err); }
}

(function initStepReorder(){
  const list = folderTimerList;
  const HOLD_MS = 230;      // sentuh-tahan sebelum drag (layar sentuh), supaya scroll biasa tetap jalan
  const TOUCH_TOL = 8;      // geser lebih dari ini sebelum HOLD_MS = dianggap scroll
  const MOUSE_START = 5;
  let st = null;

  function measureK(card){
    card.style.transform = 'translateY(100px)';
    const a = card.getBoundingClientRect().top;
    card.style.transform = '';
    const b = card.getBoundingClientRect().top;
    return ((a - b) / 100) || 1;
  }

  function update(){
    if(!st || !st.active) return;
    const card = st.card;
    card.style.transform = '';
    const h = card.getBoundingClientRect().height;
    const desiredTop = st.y - st.grab;
    const center = desiredTop + h / 2;
    const siblings = Array.from(list.children).filter(c => c !== card && c.classList.contains('timer-card'));
    const before = new Map();
    siblings.forEach(sb => before.set(sb, sb.getBoundingClientRect().top));
    let moved = false;
    for(let guard = 0; guard < 40; guard++){
      const next = card.nextElementSibling;
      const prev = card.previousElementSibling;
      if(next){
        const r = next.getBoundingClientRect();
        if(center > r.top + r.height / 2){ list.insertBefore(card, next.nextElementSibling); moved = true; continue; }
      }
      if(prev){
        const r = prev.getBoundingClientRect();
        if(center < r.top + r.height / 2){ list.insertBefore(card, prev); moved = true; continue; }
      }
      break;
    }
    const natural = card.getBoundingClientRect().top;
    card.style.transform = `translateY(${(desiredTop - natural) / st.k}px)`;
    if(moved){
      const animated = [];
      siblings.forEach(sb => {
        const d = (before.get(sb) - sb.getBoundingClientRect().top) / st.k;
        if(Math.abs(d) > 1){
          sb.style.transition = 'none';
          sb.style.transform = `translateY(${d}px)`;
          animated.push(sb);
        }
      });
      if(animated.length){
        list.getBoundingClientRect(); // paksa reflow
        animated.forEach(sb => {
          sb.style.transition = 'transform .16s ease';
          sb.style.transform = '';
          setTimeout(() => { sb.style.transition = ''; }, 220);
        });
      }
    }
  }

  function loop(){
    if(!st || !st.active) return;
    const lr = list.getBoundingClientRect();
    const edge = 48;
    let dy = 0;
    if(st.y < lr.top + edge) dy = -Math.min(14, Math.ceil((lr.top + edge - st.y) / 5));
    else if(st.y > lr.bottom - edge) dy = Math.min(14, Math.ceil((st.y - (lr.bottom - edge)) / 5));
    if(dy){ list.scrollTop += dy; update(); }
    st.raf = requestAnimationFrame(loop);
  }

  function activate(){
    if(!st || st.active) return;
    clearTimeout(st.timer);
    st.active = true;
    reorderDragging = true;
    st.k = measureK(st.card);
    st.grab = st.startY - st.card.getBoundingClientRect().top;
    st.card.classList.add('reorder-dragging');
    list.classList.add('reordering');
    if(navigator.vibrate) navigator.vibrate(12);
    update();
    st.raf = requestAnimationFrame(loop);
  }

  function detach(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onCancel);
  }

  function finish(commit){
    if(!st) return;
    const s = st;
    st = null;
    clearTimeout(s.timer);
    cancelAnimationFrame(s.raf);
    detach();
    if(!s.active) return;
    s.card.style.transform = '';
    s.card.classList.remove('reorder-dragging');
    list.classList.remove('reordering');
    const ids = Array.from(list.querySelectorAll('.timer-card')).map(c => c.dataset.id);
    reorderDragging = false;
    reorderPendingRender = false;
    if(commit) commitStepOrder(ids);
    else renderAll();
  }

  function onMove(e){
    if(!st || e.pointerId !== st.pointerId) return;
    st.y = e.clientY;
    if(!st.active){
      const dist = Math.hypot(e.clientX - st.startX, e.clientY - st.startY);
      if(st.type === 'mouse'){ if(dist > MOUSE_START) activate(); }
      else if(dist > TOUCH_TOL){ finish(false); }
      return;
    }
    e.preventDefault();
    update();
  }
  function onUp(e){ if(st && e.pointerId === st.pointerId) finish(true); }
  function onCancel(e){ if(st && e.pointerId === st.pointerId) finish(false); }

  list.addEventListener('pointerdown', (e) => {
    if(st) return;
    if(e.pointerType === 'mouse' && e.button !== 0) return;
    if(e.target.closest('button, input, select, textarea, a')) return;
    const card = e.target.closest('.timer-card-compact');
    if(!card || card.parentElement !== list) return;
    st = {
      card, pointerId: e.pointerId, type: e.pointerType,
      startX: e.clientX, startY: e.clientY, y: e.clientY,
      active: false, timer: null, raf: 0, k: 1, grab: 0
    };
    if(e.pointerType !== 'mouse') st.timer = setTimeout(activate, HOLD_MS);
    document.addEventListener('pointermove', onMove, { passive: false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onCancel);
  });

  // cegah scroll halaman/list selama kartu diseret (iOS butuh listener non-passive)
  list.addEventListener('touchmove', (e) => {
    if(reorderDragging && e.cancelable) e.preventDefault();
  }, { passive: false });
  list.addEventListener('contextmenu', (e) => { if(st) e.preventDefault(); });
  list.addEventListener('dragstart', (e) => e.preventDefault());
})();

/* ---------------- ticking (local display + finish detection) ---------------- */
function startTicker(){
  stopTicker();
  tickHandle = setInterval(tick, 250);
}
function stopTicker(){
  if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
}

async function tick(){
  const user = auth.currentUser;
  if(!user) return;
  if(multitaskMode){
    updateMultitaskSummary();
    multitaskFolderListEl.querySelectorAll('[data-finish-folder]').forEach(el => {
      const rs = folderRemainingSeconds(el.dataset.finishFolder);
      if(rs > 0) el.textContent = 'selesai ' + formatClock(Date.now() + rs * 1000);
    });
  }
  if(comboFolders.size) updateLandscapeFinishAll();
  for(const [id, data] of localTimers.entries()){
    if(data.status !== 'running') continue;
    const remaining = currentRemaining(data);
    document.querySelectorAll(`.timer-card[data-id="${id}"] [data-role="digits"]`).forEach(el => {
      el.textContent = fmt(remaining);
    });
    document.querySelectorAll(`.landscape-mini-item[data-id="${id}"] .landscape-mini-digits`).forEach(el => {
      el.textContent = fmt(remaining);
    });
    document.querySelectorAll(`.timer-card[data-id="${id}"] [data-role="visual"]`).forEach(el => {
      const vt = el.dataset.vtype;
      if(vt && vt !== 'default') el.innerHTML = visualSVG(vt, pctOf(data, remaining), true);
    });
    if(data.durationSeconds > 0){
      const pct = Math.min(100, Math.max(0, (remaining / data.durationSeconds) * 100)) + '%';
      document.querySelectorAll(`.timer-card[data-id="${id}"] .bar-fill`).forEach(el => {
        el.style.width = pct;
      });
    }
    if(remaining <= 0){
      data.status = 'finished';
      playChime(data.soundType);
      notify('Essentime', `"${data.name}" selesai.`);
      try{
        await updateDoc(doc(db, 'users', user.uid, 'timers', id), {
          status: 'finished',
          endAt: null,
          remainingSeconds: 0
        });
        await maybeStartNextInFolder(data.folder || 'Umum', id);
      }catch(e){ /* will resync on next snapshot */ }
    }
  }
}

/* ---------------- service worker ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
