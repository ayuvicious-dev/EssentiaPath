<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Essentime</title>
<meta name="description" content="Essentime, timer sederhana untuk ritual harianmu.">
<meta name="theme-color" content="#B8763E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFFBF3;
    --paper:#FFFFFF;
    --gold-light:#E8B876;
    --gold-dark:#B8763E;
    --gold-mid:#D9A05B;
    --brown:#4A2F18;
    --brown-soft:#8A6B49;
    --brown-faint:#C9AE8C;
    --line:#EFE2CD;
    --shadow: rgba(90,58,30,0.10);
    --danger:#B5533C;
    --ok:#6E8B57;
    --glow:#FFF3DE;
    --radius-card: 20px;
    --radius-input: 12px;
    --serif: 'Playfair Display', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  html[data-theme="dark"]{
    --cream:#1C1712;
    --paper:#26201A;
    --gold-light:#E8B876;
    --gold-dark:#C98A4F;
    --gold-mid:#D9A05B;
    --brown:#F3E9DA;
    --brown-soft:#C9AE8C;
    --brown-faint:#8A7359;
    --line:#3A3126;
    --shadow: rgba(0,0,0,0.35);
    --danger:#E28A72;
    --ok:#9BC17F;
    --glow:#2E2519;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overscroll-behavior-y:contain;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, var(--glow) 0%, transparent 60%),
      var(--cream);
    color:var(--brown);
    font-family:var(--sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  input{font-family:inherit;}

  a{color:var(--gold-dark);}

  .shell{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    padding:28px 20px 140px;
    display:flex;
    flex-direction:column;
  }

  /* ---------- brand mark ---------- */
  .brandmark{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brandmark img{width:38px;height:38px;display:block;}
  .brandmark .wordmark{
    font-family:var(--serif);
    font-weight:700;
    font-size:26px;
    color:var(--brown);
    letter-spacing:0.2px;
  }

  /* ---------- auth screen ---------- */
  #auth-screen{
    flex:1;
    display:none; /* baru ditampilkan setelah dipastikan belum login (cegah prompt Face ID/Passwords iOS) */
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px 0;
  }
  #auth-screen .brandmark{
    flex-direction:column;
    gap:14px;
    margin-bottom:6px;
  }
  #auth-screen .brandmark img{width:72px;height:72px;}
  #auth-screen .wordmark{font-size:34px;}
  .tagline{
    color:var(--brown-soft);
    font-size:14px;
    margin:2px 0 30px;
    letter-spacing:0.3px;
  }

  .auth-card{
    background:var(--paper);
    border-radius:var(--radius-card);
    box-shadow:0 18px 40px -18px var(--shadow), 0 2px 8px -2px var(--shadow);
    padding:28px 24px;
    width:100%;
    text-align:left;
  }
  .auth-tabs{
    display:flex;
    gap:6px;
    background:var(--cream);
    border-radius:999px;
    padding:4px;
    margin-bottom:22px;
  }
  .auth-tab{
    flex:1;
    border:none;
    background:transparent;
    padding:9px 0;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    color:var(--brown-soft);
    cursor:pointer;
    transition:background .2s, color .2s;
  }
  .auth-tab.active{
    background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color:#fff;
  }

  label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--brown-soft);
    margin:0 0 6px;
  }
  .field{margin-bottom:16px;}
  .field input, .field select{
    width:100%;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:var(--radius-input);
    font-size:15px;
    color:#3E2A16;
    background:#FFFEFC;
    outline:none;
    transition:border-color .15s;
  }
  .field input::placeholder{ color:#B7A488; opacity:1; }
  .field select{ color-scheme:light; }
  .field input:focus, .field select:focus{border-color:var(--gold-dark);}
  .select-with-edit{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .select-with-edit select{flex:1;min-width:0;}
  .select-with-edit .icon-btn{width:44px;height:44px;flex-shrink:0;}
  .select-with-edit .combo-wrap{flex:1;min-width:0;}

  .combo-wrap{position:relative;}
  .combo-dropdown{
    display:none;
    position:absolute;
    left:0; right:0; top:calc(100% + 6px);
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:var(--radius-input);
    box-shadow:0 14px 30px -10px var(--shadow);
    max-height:200px;
    overflow-y:auto;
    z-index:20;
  }
  .combo-wrap.open .combo-dropdown{display:block;}
  .combo-option{
    padding:11px 14px;
    font-size:14.5px;
    font-weight:600;
    color:var(--brown);
    cursor:pointer;
  }
  .combo-option:hover, .combo-option.active{background:var(--cream);}
  .combo-option.combo-create{color:var(--gold-dark);}
  .combo-option + .combo-option{border-top:1px solid var(--line);}
  .combo-empty{padding:11px 14px; font-size:13.5px; color:var(--brown-faint);}

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    border-radius:var(--radius-input);
    padding:13px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{
    width:100%;
    background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color:#fff;
    box-shadow:0 10px 22px -10px rgba(184,118,62,0.55);
  }
  .btn-primary:disabled{opacity:0.55;cursor:default;}
  .btn-ghost{
    background:transparent;
    color:var(--brown-soft);
    padding:8px 10px;
  }

  .auth-msg{
    font-size:13px;
    margin-top:14px;
    padding:10px 12px;
    border-radius:10px;
    display:none;
  }
  .auth-msg.error{display:block;background:#FBEAE4;color:var(--danger);}
  .auth-msg.info{display:block;background:#F0F6EC;color:var(--ok);}

  .auth-foot{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:var(--brown-soft);
  }
  .auth-foot button{
    background:none;border:none;color:var(--gold-dark);
    font-weight:600;cursor:pointer;font-size:13px;padding:0;
  }

  /* ---------- app screen ---------- */
  #app-screen{display:none;flex:1;flex-direction:column;}
  .app-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .app-header .greet{
    font-size:12.5px;
    color:var(--brown-soft);
    margin-top:1px;
  }
  .header-actions{display:flex;align-items:center;gap:4px;}
  .icon-btn{
    background:var(--paper);
    border:1.5px solid var(--line);
    width:38px;height:38px;
    border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--brown-soft);
  }
  .icon-btn:hover{border-color:var(--gold-mid);color:var(--gold-dark);}
  .icon-btn.danger-btn:hover{border-color:var(--danger);color:var(--danger);}
  .icon-btn.star-btn.active{
    background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    border-color:transparent;
    color:#fff;
  }
  .icon-btn.star-btn.active svg{ fill:currentColor; }
  .icon-btn.pin-btn.active{
    background:var(--brown);
    border-color:transparent;
    color:var(--cream);
  }
  .icon-btn.pin-btn.active svg{ fill:currentColor; }

  /* new timer composer */
  .composer{
    background:var(--paper);
    border-radius:var(--radius-card);
    box-shadow:0 14px 30px -18px var(--shadow);
    padding:18px 18px 16px;
    margin-bottom:24px;
  }
  .composer .field{margin-bottom:12px;}
  .duration-row{
    display:flex;
    gap:10px;
    margin-bottom:14px;
  }
  .duration-row .field{flex:1;margin-bottom:0;}
  .duration-row input{text-align:center;}
  .duration-row input#timer-name{text-align:left;}

  /* rentetan (timer chain) */
  .rentetan-section{ margin-bottom:14px; }
  .rentetan-list{ display:flex; flex-direction:column; }
  .rentetan-item{
    display:flex;
    gap:8px;
    position:relative;
    padding-left:18px;
  }
  .rentetan-item::before{
    content:'';
    position:absolute;
    left:5px;
    top:0;
    bottom:-2px;
    width:1.5px;
    background:var(--line);
  }
  .rentetan-item:last-child::before{ bottom:50%; }
  .rentetan-item::after{
    content:'';
    position:absolute;
    left:2px;
    top:16px;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--gold-mid);
  }
  .rentetan-item-body{
    flex:1;
    min-width:0;
    background:#FFFEFC;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
  }
  .rentetan-item-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .rentetan-item-num{
    font-size:11.5px;
    font-weight:700;
    color:var(--gold-dark);
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .rentetan-remove-btn{
    background:none;
    border:none;
    color:var(--brown-faint);
    cursor:pointer;
    padding:4px;
    display:flex;
    border-radius:6px;
  }
  .rentetan-remove-btn:hover{ color:var(--danger); background:#FBEAE4; }
  .rentetan-item-body .field{ margin-bottom:10px; }
  .rentetan-item-body .field:last-child{ margin-bottom:0; }
  .rentetan-item-body input{ text-align:left; }
  .rentetan-add-btn{
    width:100%;
    border:1.5px dashed var(--gold-mid);
    background:transparent;
    color:var(--gold-dark);
    font-size:12.5px;
    font-weight:600;
    padding:10px;
    border-radius:14px;
    cursor:pointer;
    margin-left:18px;
    width:calc(100% - 18px);
  }
  .rentetan-add-btn:hover{ background:#FBEEDB; }
  .rentetan-total{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#FBEEDB;
    border-radius:14px;
    padding:12px 14px;
    margin:14px 0;
    font-size:13px;
    font-weight:600;
    color:var(--brown-soft);
  }
  .rentetan-total strong{
    font-family:var(--serif);
    font-size:16px;
    color:var(--gold-dark);
  }

  .sound-option-row{
    display:flex;
    flex-wrap:nowrap;
    gap:8px;
  }
  .sound-option-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:1 1 0;
    min-width:0;
    border:1.5px solid var(--line);
    background:var(--cream);
    padding:12px 4px;
    border-radius:14px;
    cursor:pointer;
    transition:background .15s, border-color .15s, color .15s, transform .1s;
    color:var(--brown-soft);
  }
  .sound-option-btn:active{ transform:scale(0.96); }
  .sound-option-btn .sound-symbol{ width:20px; height:20px; }
  .sound-option-btn .sound-label{ display:none; }
  .sound-option-btn.active{
    border-color:var(--gold-dark);
    background:#FBEEDB;
    color:var(--gold-dark);
  }

  .display-option-row{
    display:flex;
    flex-wrap:nowrap;
    gap:8px;
  }
  .display-option-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex:1 1 0;
    min-width:0;
    border:1.5px solid var(--line);
    background:var(--cream);
    padding:10px 2px 8px;
    border-radius:14px;
    cursor:pointer;
    color:var(--brown-soft);
    font-size:10.5px;
    font-weight:600;
    transition:background .15s, border-color .15s, color .15s, transform .1s;
  }
  .display-option-btn:active{ transform:scale(0.96); }
  .display-option-btn .dopt-icon{ width:32px; height:32px; display:flex; align-items:center; justify-content:center; }
  .display-option-btn .dopt-icon svg{ width:100%; height:100%; display:block; }
  .display-option-btn.active{
    border-color:var(--gold-dark);
    background:#FBEEDB;
    color:var(--gold-dark);
  }
  html[data-theme="dark"] .display-option-btn.active{ background:var(--glow); }
  .mini-visual{ width:28px; height:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; align-self:center; }
  .mini-visual svg{ width:100%; height:100%; display:block; }
  .timer-card:not(.timer-card-compact) .mini-visual{ width:52px; height:52px; }
  .landscape-visual{ height:min(24vh,150px); margin:2px auto 8px; display:flex; align-items:center; justify-content:center; }
  .landscape-visual svg{ height:100%; width:auto; max-width:100%; display:block; }

  .folder-dur-list{ display:flex; flex-direction:column; gap:8px; }
  .folder-dur-row{
    display:flex;
    align-items:center;
    gap:10px;
    background:#FFFEFC;
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:8px 10px 8px 12px;
  }
  .folder-dur-name{
    flex:1;
    min-width:0;
    font-size:13.5px;
    font-weight:600;
    color:#3E2A16;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .field .folder-dur-row input{ width:76px; flex-shrink:0; text-align:center; padding:8px 6px; }
  .folder-dur-unit{ font-size:12px; color:var(--brown-faint); flex-shrink:0; }

  /* timer list */
  #timer-list{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .empty-state{
    text-align:center;
    padding:20px 10px;
    color:var(--brown-faint);
  }
  .empty-state img{width:56px;opacity:0.55;margin-bottom:14px;}
  .empty-state p{font-size:14px;margin:0;line-height:1.6;}

  .timer-card{
    background:var(--paper);
    border-radius:var(--radius-card);
    box-shadow:0 12px 26px -18px var(--shadow);
    padding:18px 18px 16px;
    position:relative;
    overflow:hidden;
  }
  .timer-card.finished{
    box-shadow:0 12px 26px -16px rgba(181,83,60,0.35);
  }
  .timer-card .bar-bg{
    position:absolute;left:0;top:0;height:7px;width:100%;
    background:var(--line);
  }
  .timer-card .bar-fill{
    position:absolute;left:0;top:0;height:7px;
    background:linear-gradient(90deg, var(--gold-light), var(--gold-dark));
    transition:width 1s linear;
  }
  .timer-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10px;
    margin-top:4px;
  }
  .timer-name{
    font-weight:600;
    font-size:15px;
    color:var(--brown);
    word-break:break-word;
    padding-right:8px;
  }
  .timer-name .status{
    display:block;
    font-size:11.5px;
    font-weight:500;
    color:var(--brown-faint);
    margin-top:2px;
  }
  .card-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .delete-btn{
    background:none;border:none;color:var(--brown-faint);
    cursor:pointer;padding:4px;flex-shrink:0;
  }
  .delete-btn:hover{color:var(--danger);}
  .edit-btn{
    background:none;border:none;color:var(--brown-faint);
    cursor:pointer;padding:4px;flex-shrink:0;
  }
  .edit-btn:hover{color:var(--gold-dark);}

  .timer-mid{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
  }
  .timer-digits{
    font-family:var(--serif);
    font-weight:600;
    font-size:38px;
    color:var(--brown);
    letter-spacing:0.5px;
    font-variant-numeric:tabular-nums;
  }
  .timer-card.finished .timer-digits{color:var(--danger);}

  .timer-controls{display:flex;gap:8px;}
  .ctrl-btn{
    width:44px;height:44px;
    border-radius:13px;
    border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:#fff;
  }
  .ctrl-btn.play{background:linear-gradient(135deg, var(--gold-light), var(--gold-dark));}
  .ctrl-btn.pause{background:var(--brown-soft);}
  .ctrl-btn.reset{background:var(--paper);color:var(--brown-soft);border:1.5px solid var(--line);}
  .ctrl-btn:active{transform:scale(0.94);}

  /* compact variant used for chain/sequence lists so many steps fit without excess scrolling */
  .timer-card-compact{padding:12px 14px 11px;}
  .timer-card-compact .timer-top{margin-bottom:0;margin-top:0;}
  .timer-card-compact .timer-top.compact{align-items:center;gap:10px;flex-wrap:nowrap;}
  .timer-card-compact .timer-name{font-size:14px;flex:1;min-width:0;padding-right:0;}
  .timer-card-compact .timer-digits-wrap{flex-shrink:0;}
  .timer-card-compact .timer-digits{font-size:15px;font-family:var(--sans);font-weight:500;letter-spacing:0;}
  .timer-card-compact .bar-bg{display:none;}
  .timer-card-compact .bar-fill{display:none;}
  .timer-card-compact + .timer-card-compact{border-top:1px solid var(--line);}
  .timer-card-compact .step-number{width:18px;height:18px;font-size:11px;}
  .timer-card-compact .card-actions{flex-shrink:0;}
  .timer-card-compact .timer-controls.compact{justify-content:flex-end;margin-top:8px;}
  .timer-card-compact .ctrl-btn{width:34px;height:34px;border-radius:10px;}
  .timer-card-compact .ctrl-btn svg{width:14px;height:14px;}

  footer.hint{
    text-align:center;
    color:var(--brown-faint);
    font-size:12px;
    margin-top:30px;
  }

  /* ---------- tabs ---------- */
  .tab-screen{flex:1;}
  .section-title{
    font-family:var(--serif);
    font-size:16px;
    font-weight:600;
    color:var(--brown);
    margin:4px 0 12px;
  }

  /* dashboard stats */
  .stats-row{
    display:flex;
    gap:10px;
    margin-bottom:22px;
  }
  .stat-card{
    flex:1;
    background:var(--paper);
    border-radius:16px;
    box-shadow:0 12px 26px -18px var(--shadow);
    padding:14px 8px;
    text-align:center;
  }
  .stat-num{
    font-family:var(--serif);
    font-size:24px;
    font-weight:700;
    color:var(--gold-dark);
  }
  .stat-label{
    font-size:11px;
    color:var(--brown-soft);
    margin-top:2px;
  }

  /* folder chips */
  .folder-chips{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
    margin-bottom:18px;
  }
  .folder-chips-top{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    padding-bottom:14px;
    margin-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .folder-row{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
    width:100%;
    padding:12px 4px;
    border-bottom:1px solid var(--line);
  }
  .folder-row:last-child{
    border-bottom:none;
  }
  .folder-row.active{
    border-radius:0;
    padding:12px 4px 12px 11px;
    border-bottom:1px solid var(--line);
    background:none;
    border-left:3px solid var(--gold-dark);
  }
  .folder-row.active .folder-chip-label{ color:var(--brown); }
  .folder-row.active .folder-row-action{ color:var(--brown-soft); }
  .folder-row.active .folder-row-action:hover{ color:var(--gold-dark); }
  .folder-chip-label{
    border:none;
    background:transparent;
    color:var(--brown-soft);
    font-size:12.5px;
    font-weight:600;
    text-align:left;
    cursor:pointer;
    flex:1;
    min-width:0;
    padding:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .folder-row .folder-chip-label{
    font-size:14.5px;
    font-weight:700;
    line-height:1.3;
    color:var(--brown);
    white-space:normal;
    overflow-wrap:anywhere;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .folder-row-main{
    display:flex;

  .timer-detail-controls{display:flex;gap:14px;}
  .timer-detail-controls .ctrl-btn{width:58px;height:58px;border-radius:17px;}
  .timer-detail-controls .ctrl-btn svg{width:22px;height:22px;}

  /* ---------- landscape fullscreen timer ---------- */
  #landscape-fullscreen{display:none;}
  body.landscape-fullscreen #landscape-fullscreen{
    display:flex;
    position:fixed;
    inset:0;
    z-index:200;
    align-items:center;
    justify-content:center;
    background:var(--cream);
    padding:24px;
  }
  body.landscape-fullscreen .app-header,
  body.landscape-fullscreen .tab-screen,
  body.landscape-fullscreen .bottom-nav,
  body.landscape-fullscreen .bottom-nav-fade,
  body.landscape-fullscreen .modal-backdrop{
    display:none !important;
  }
  .landscape-card{
    width:100%;
    max-width:640px;
    background:var(--paper);
    border-radius:28px;
    box-shadow:0 24px 60px -18px var(--shadow);
    padding:34px 30px 30px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .landscape-card .bar-bg{height:10px;}
  .landscape-card .bar-fill{height:10px;}
  .landscape-close-btn{
    position:absolute;
    top:14px;right:14px;
    width:34px;height:34px;
    border-radius:11px;
    border:none;
    background:var(--cream);
    color:var(--brown-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .landscape-focus-btn{
    position:absolute;
    top:14px;left:14px;
    width:34px;height:34px;
    border-radius:11px;
    border:none;
    background:var(--cream);
    color:var(--brown-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:2;
  }
  .landscape-focus-btn:hover{color:var(--brown);}
  .landscape-focus-btn:active{transform:scale(0.94);}
  /* mode fokus: hanya nama timer + tampilan visual (jam pasir dll) */
  .landscape-card.focus-mode.has-visual .landscape-digits,
  .landscape-card.focus-mode.has-visual .landscape-controls,
  .landscape-card.focus-mode.has-visual .landscape-mini-list,
  .landscape-card.focus-mode.has-visual .landscape-finish-all{ display:none !important; }
  .landscape-card.focus-mode.has-visual .landscape-name{ font-size:24px; margin:10px 0 14px; }
  .landscape-card.focus-mode.has-visual .landscape-visual{ height:min(56vh,340px); margin:0 auto 6px; }
  /* mode fokus + tampilan Default: hanya angka besar */
  .landscape-card.focus-mode:not(.has-visual) .landscape-controls,
  .landscape-card.focus-mode:not(.has-visual) .landscape-mini-list,
  .landscape-card.focus-mode:not(.has-visual) .landscape-finish-all,
  .landscape-card.focus-mode:not(.has-visual) .bar-bg{ display:none !important; }
  .landscape-card.focus-mode:not(.has-visual) .landscape-name{ font-size:24px; margin:10px 0 0; }
  .landscape-card.focus-mode:not(.has-visual) .landscape-digits{
    font-size:min(30vw, 190px);
    margin:8px 0 10px;
    line-height:1.05;
  }
  .landscape-close-btn:hover{color:var(--brown);}
  .landscape-close-btn:active{transform:scale(0.94);}
  .landscape-name{
    font-weight:600;
    font-size:20px;
    color:var(--brown);
    margin:10px 0 8px;
    word-break:break-word;
  }
  .landscape-digits{
    font-family:var(--serif);
    font-weight:600;
    font-size:min(18vw, 96px);
    color:var(--brown);
    letter-spacing:0.5px;
    font-variant-numeric:tabular-nums;
    margin-bottom:22px;
  }
  .landscape-card.finished .landscape-digits{color:var(--danger);}
  .landscape-controls{display:flex;gap:16px;justify-content:center;}
  .landscape-controls .ctrl-btn{width:64px;height:64px;border-radius:18px;}
  .landscape-controls .ctrl-btn svg{width:24px;height:24px;}

  /* ---------- bottom nav ---------- */
  .bottom-nav-fade{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    height:96px;
    background:linear-gradient(to top, var(--cream) 45%, rgba(255,255,255,0) 100%);
    pointer-events:none;
    z-index:39;
  }
  .bottom-nav{
    position:fixed;
    left:50%;
    bottom:14px;
    transform:translateX(-50%);
    width:calc(100% - 32px);
    max-width:420px;
    background:var(--paper);
    border-radius:22px;
    box-shadow:0 16px 36px -14px var(--shadow), 0 2px 10px -2px var(--shadow);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 8px;
    z-index:40;
  }
  .nav-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    background:transparent;
    border:none;
    color:var(--brown-faint);
    font-size:10.5px;
    font-weight:600;
    padding:7px 2px;
    border-radius:14px;
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .nav-item svg{width:19px;height:19px;}
  .nav-item.active{color:var(--gold-dark);background:#FBEEDB;}

  @media (prefers-reduced-motion: reduce){
    .bar-fill{transition:none;}
    .btn, .ctrl-btn{transition:none;}
  }

  /* Cegah auto-zoom iOS saat fokus ke input: font-size efektif harus >= 16px.
     --ui-zoom mengompensasi pengaturan ukuran huruf (CSS zoom) di Pengaturan. */
  input, select, textarea,
  .field input, .field select,
  .folder-search-wrap input,
  .field .folder-dur-row input{
    font-size:calc(16px / var(--ui-zoom, 1)) !important;
  }
  /* kolom rename judul: ukuran & ketebalan sama persis dengan judulnya (menimpa aturan 16px di atas) */
  .folder-row .folder-title-input{
    font-size:14.5px !important;
    font-weight:700;
    line-height:1.3;
    color:var(--brown);
  }
  #folder-detail-title .folder-title-input{
    font-size:17px !important;
    font-family:var(--serif);
    font-weight:700;
  }
  /* drag untuk ubah urutan langkah di dalam folder */
  #folder-timer-list .timer-card-compact{
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; cursor:grab;
  }
  #folder-timer-list.reordering, #folder-timer-list.reordering .timer-card-compact{ cursor:grabbing; }
  .timer-card.reorder-dragging{
    position:relative; z-index:5; transition:none !important;
    box-shadow:0 16px 32px -10px rgba(90,58,30,.38);
    scale:1.02; opacity:.97;
  }

  /* ---------- splash / layar pembuka ---------- */
  #splash-screen{
    position:fixed;
    inset:0;
    z-index:10000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse 700px 420px at 50% 40%, var(--glow) 0%, transparent 65%),
      var(--cream);
    transition:opacity .45s ease, visibility .45s ease;
  }
  #splash-screen.hide{ opacity:0; visibility:hidden; pointer-events:none; }
  .splash-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .splash-logo{
    width:112px;
    height:112px;
    display:block;
    animation:splash-breathe 2.4s ease-in-out infinite;
  }
  .splash-bar{
    width:min(180px, 56vw);
    height:5px;
    border-radius:999px;
    background:var(--line);
    overflow:hidden;
  }
  .splash-bar-fill{
    width:0%;
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--gold-light), var(--gold-dark));
  }
  .splash-pct{
    font-family:var(--sans);
    font-size:15px;
    font-weight:600;
    letter-spacing:1px;
    color:var(--brown-soft);
    font-variant-numeric:tabular-nums;
    min-width:4ch;
    text-align:center;
  }
  @keyframes splash-breathe{
    0%,100%{ transform:scale(1); opacity:0.92; }
    50%{ transform:scale(1.05); opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .splash-logo{ animation:none; }
    #splash-screen{ transition:none; }
  }
</style>
</head>

<script>
(function(){
  /* terapkan tema tersimpan lebih awal agar splash tidak berkedip terang saat mode gelap */
  try{
    var m = localStorage.getItem('essentime-theme-mode');
    if(m) document.documentElement.setAttribute('data-theme', m);
  }catch(e){}

  var el = document.getElementById('splash-screen');
  var pctEl = document.getElementById('splash-pct');
  var barEl = document.getElementById('splash-bar-fill');
  if(!el || !pctEl) return;
  var MILESTONE = { dom:20, load:45, fonts:60, auth:85, data:100 };
  var MIN_MS = 900, MAX_MS = 7000;
  var started = Date.now();
  var shown = 0, target = 0, finished = false, raf = 0;

  function setTarget(t){ if(t > target) target = Math.min(100, t); }
  function mark(name, hasUser){
    if(finished) return;
    if(name === 'auth'){
      /* belum login -> tidak ada data yang perlu dimuat */
      setTarget(hasUser ? MILESTONE.auth : 100);
      return;
    }
    if(MILESTONE[name] != null) setTarget(MILESTONE[name]);
  }
  function finish(){
    finished = true;
    cancelAnimationFrame(raf);
    pctEl.textContent = '100%';
    if(barEl) barEl.style.width = '100%';
    el.classList.add('hide');
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 600);
  }
  function tick(){
    if(finished) return;
    var elapsed = Date.now() - started;
    if(elapsed > MAX_MS) target = 100;
    if(shown < target){
      shown = Math.min(target, shown + Math.max(0.35, (target - shown) * 0.08));
    }else if(target < 100){
      /* merayap pelan menuju tonggak berikutnya supaya angka tidak terasa macet */
      shown = Math.min(Math.min(target + 8, 94), shown + 0.04);
    }
    pctEl.textContent = Math.floor(shown) + '%';
    if(barEl) barEl.style.width = shown + '%';
    if(shown >= 100 && elapsed >= MIN_MS){ finish(); return; }
    raf = requestAnimationFrame(tick);
  }

  window.__splash = { mark: mark };
  mark('dom');
  if(document.readyState === 'complete') mark('load');
  else window.addEventListener('load', function(){ mark('load'); });
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(function(){ mark('fonts'); }, function(){ mark('fonts'); });
  }else{
    mark('fonts');
  }
  tick();
})();
</script>

  if(now.getDate() < release.getDate()) months -= 1;
  if(months < 0){ years -= 1; months += 12; }
  let label;
  if(years <= 0 && months <= 0){
    label = 'Baru rilis';
  }else if(years <= 0){
    label = `${months} bulan`;
  }else if(months === 0){
    label = `${years} tahun`;
  }else{
    label = `${years} tahun ${months} bulan`;
  }
  settingsReleaseAge.textContent = label;
}

/* ---------------- tampilan timer (default / jam pasir / lingkaran / cangkir) ---------------- */
const DISPLAY_OPTIONS = [
  { type:'default',   label:'Default' },
  { type:'hourglass', label:'Jam pasir' },
  { type:'ring',      label:'Lingkaran' },
  { type:'cup',       label:'Cangkir' }
];
let visualUid = 0;
/* pct = sisa waktu dalam persen (100 = penuh, 0 = habis); running = timer sedang berjalan */
function visualSVG(type, pct, running){
  const p = Math.min(1, Math.max(0, (pct || 0) / 100));
  const id = 'vz' + (visualUid++);
  if(type === 'ring'){
    const C = 2 * Math.PI * 42;
    return `<svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="9"/>
      ${p > 0.002 ? `<circle cx="50" cy="50" r="42" fill="none" stroke="var(--gold-dark)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - p)).toFixed(2)}" transform="rotate(-90 50 50)"/>` : ''}
    </svg>`;
  }
  if(type === 'hourglass'){
    const glass = 'M14 8 H66 V14 C66 30 48 40 44 50 C48 60 66 70 66 86 V92 H14 V86 C14 70 32 60 36 50 C32 40 14 30 14 14 Z';
    const h1 = 42 * p;
    const h2 = 42 * (1 - p);
    return `<svg viewBox="0 0 80 100" aria-hidden="true">
      <defs><clipPath id="${id}"><path d="${glass}"/></clipPath></defs>
      <path d="${glass}" fill="var(--paper)" opacity="0.6"/>
      <g clip-path="url(#${id})">
        <rect x="0" y="${(50 - h1).toFixed(2)}" width="80" height="${h1.toFixed(2)}" fill="var(--gold-mid)"/>
        <rect x="0" y="${(92 - h2).toFixed(2)}" width="80" height="${h2.toFixed(2)}" fill="var(--gold-mid)"/>
      </g>
      ${running && p > 0.002 ? `<line x1="40" y1="48" x2="40" y2="${(92 - h2).toFixed(2)}" stroke="var(--gold-dark)" stroke-width="1.6" stroke-linecap="round"/>` : ''}
      <path d="${glass}" fill="none" stroke="var(--brown-soft)" stroke-width="2.4" stroke-linejoin="round"/>
      <rect x="9" y="3" width="62" height="6" rx="2.5" fill="var(--brown-soft)"/>
      <rect x="9" y="91" width="62" height="6" rx="2.5" fill="var(--brown-soft)"/>
    </svg>`;
  }
  if(type === 'cup'){
    const body = 'M16 38 H76 V58 C76 76 64 86 46 86 C28 86 16 76 16 58 Z';
    const h = 48 * p;
    return `<svg viewBox="0 0 100 100" aria-hidden="true">
      <defs><clipPath id="${id}"><path d="${body}"/></clipPath></defs>
      ${running && p > 0.002 ? `<path d="M34 28 C30 22 38 20 34 13" fill="none" stroke="var(--brown-faint)" stroke-width="3" stroke-linecap="round"/><path d="M50 28 C46 22 54 20 50 13" fill="none" stroke="var(--brown-faint)" stroke-width="3" stroke-linecap="round"/><path d="M66 28 C62 22 70 20 66 13" fill="none" stroke="var(--brown-faint)" stroke-width="3" stroke-linecap="round"/>` : ''}
      <path d="${body}" fill="var(--paper)" opacity="0.6"/>
      <g clip-path="url(#${id})">
        <rect x="10" y="${(86 - h).toFixed(2)}" width="72" height="${h.toFixed(2)}" fill="var(--gold-mid)"/>
      </g>
      <path d="M76 44 H82 C94 44 94 66 80 66 H74" fill="none" stroke="var(--brown-soft)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="${body}" fill="none" stroke="var(--brown-soft)" stroke-width="4" stroke-linejoin="round"/>
      <line x1="10" y1="93" x2="84" y2="93" stroke="var(--brown-soft)" stroke-width="4" stroke-linecap="round"/>
    </svg>`;
  }
  /* default: angka besar saja (untuk pratinjau pilihan) */
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <text x="50" y="62" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="30" font-weight="600" fill="currentColor">05:00</text>
  </svg>`;
}
function normalizeDisplayType(t){
  return DISPLAY_OPTIONS.some(o => o.type === t) ? t : 'default';
}
function pctOf(data, seconds){
  return data.durationSeconds > 0 ? Math.min(100, Math.max(0, (seconds / data.durationSeconds) * 100)) : 0;
}

/* ---------------- finish sounds (no external audio file) + vibration ---------------- */
function playChime(soundType){
  const type = soundType || 'chime';
  if(type === 'vibrate'){
    try{ if('vibrate' in navigator) navigator.vibrate([220, 120, 220, 120, 220]); }catch(e){}
    return;
  }
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    const tone = (freq, start, dur, waveType, peak) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = waveType || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + start);
      gain.gain.exponentialRampToValueAtTime(peak || 0.25, now + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + start);
      osc.stop(now + start + dur + 0.02);
    };
    if(type === 'bell'){
      tone(440, 0, 1.1, 'sine', 0.28);
      tone(880, 0, 0.9, 'sine', 0.08);
    }else if(type === 'melody'){
      [523.25, 587.33, 659.25, 783.99].forEach((freq, i) => tone(freq, i * 0.16, 0.22, 'sine', 0.22));
    }else if(type === 'alarm'){
      [0, 0.18, 0.36, 0.54, 0.8, 0.98, 1.16, 1.34].forEach(offset => tone(880, offset, 0.14, 'square', 0.18));
    }else{
      [0, 0.28, 0.56].forEach((offset, i) => tone(i === 2 ? 880 : 660, offset, 0.26, 'sine', 0.25));
    }
  }catch(e){ /* audio not available */ }
}

function notify(title, body){

  }
}

createFolderBtn.addEventListener('click', async () => {
  hideNewFolderMsg();

  if(!user) return;
  const name = newFolderNameInput.value.trim();
  if(!name){
    showNewFolderMsg('Isi nama folder dulu.', 'error');
    newFolderNameInput.focus();
    return;
  }
  const clash = knownFolderNames.some(f =>
    f.toLowerCase() === name.toLowerCase() &&
    !(folderModalMode === 'rename' && f.toLowerCase() === renamingFolderOldName.toLowerCase())
  );
  if(clash){
    showNewFolderMsg('Folder dengan nama itu sudah ada.', 'error');
    return;
  }
  let category = '';
  if(newFolderCategorySelect.value === '__new__'){
    category = newFolderCategoryNewInput.value.trim();
    if(!category){
      showNewFolderMsg('Isi nama kategori baru dulu, atau pilih kategori yang sudah ada.', 'error');
      newFolderCategoryNewInput.focus();
      return;
    }
  }else{
    category = newFolderCategorySelect.value || '';
  }
  if(!category){
    showNewFolderMsg('Pilih kategori dulu.', 'error');
    return;
  }
  const soundType = selectedFolderSoundType || 'chime';
  const displayType = selectedFolderDisplayType || 'default';
  const durationChanges = [];
  if(folderModalMode === 'rename'){
    for(const inp of folderDurationsList.querySelectorAll('.folder-dur-input')){
      const sec = minutesToSeconds(inp.value);
      if(!(sec > 0)){
        showNewFolderMsg('Durasi tiap timer harus lebih dari 0 menit.', 'error');
        inp.focus();
        return;
      }
      if(String(sec) !== inp.dataset.orig) durationChanges.push([inp.dataset.id, sec]);
    }
  }
  createFolderBtn.disabled = true;
  try{
    if(category && !knownCategoryNames.includes(category)){
      await addDoc(collection(db, 'users', user.uid, 'categories'), { name: category, createdAt: serverTimestamp() });
    }
    if(folderModalMode === 'rename'){
      await renameFolder(renamingFolderOldName, name, category, soundType, displayType);
      /* durasi yang diubah: timer kembali ke kondisi siap dengan durasi baru */
      await Promise.all(durationChanges.map(([id, sec]) =>
        updateDoc(doc(db, 'users', user.uid, 'timers', id), {
          durationSeconds: sec,
          remainingSeconds: sec,
          status: 'idle',
          endAt: null
        })
      ));
    }else{
      await addDoc(collection(db, 'users', user.uid, 'folders'), {
        name,
        category,
        soundType,
        displayType,
        createdAt: serverTimestamp()
      });
    }
    currentFolder = name;
    closeNewFolderModal();
  }catch(err){
    console.error(err);
    showNewFolderMsg((folderModalMode === 'rename' ? 'Gagal mengubah folder: ' : 'Gagal membuat folder: ') + (err && err.message ? err.message : 'kesalahan tidak diketahui'), 'error');
  }finally{
    createFolderBtn.disabled = false;
  }
});

async function renameFolder(oldName, newName, category, soundType, displayType){
  const user = auth.currentUser;
  if(!user) return;
  const entry = Array.from(localFolders.entries()).find(([, d]) => d.name === oldName);
  const fields = { name: newName };
  if(category !== undefined) fields.category = category;
  if(soundType !== undefined) fields.soundType = soundType;
  if(displayType !== undefined) fields.displayType = displayType;
  if(entry){
    await updateDoc(doc(db, 'users', user.uid, 'folders', entry[0]), fields);
  }else{
    await addDoc(collection(db, 'users', user.uid, 'folders'), { ...fields, createdAt: serverTimestamp() });
  }
  const timersInFolder = Array.from(localTimers.entries()).filter(([, d]) => (d.folder || 'Umum') === oldName);
  await Promise.all(timersInFolder.map(([id]) =>
    updateDoc(doc(db, 'users', user.uid, 'timers', id), {
      folder: newName,
      ...(displayType !== undefined ? { displayType } : {})
    })
  ));
}

async function handleDeleteFolder(folderName){
  const user = auth.currentUser;
  if(!user) return;
  const timersInFolder = Array.from(localTimers.entries()).filter(([, d]) => (d.folder || 'Umum') === folderName);
  const n = timersInFolder.length;
  const msg = n
    ? `Hapus folder "${folderName}" beserta ${n} timer di dalamnya? Semua timer ikut terhapus permanen dan tidak bisa dikembalikan.`
    : `Hapus folder "${folderName}"?`;
  const ok = confirm(msg);
  if(!ok) return;
  try{
    await Promise.all(timersInFolder.map(([id]) =>
      deleteDoc(doc(db, 'users', user.uid, 'timers', id))
    ));
    const entry = Array.from(localFolders.entries()).find(([, d]) => d.name === folderName);
    if(entry){
      await deleteDoc(doc(db, 'users', user.uid, 'folders', entry[0]));
    }
    if(currentFolder === folderName){
      currentFolder = '';
      folderListView = true;
    }
  }catch(err){
    console.error(err);
    alert('Gagal menghapus folder: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui'));
  }
}

async function handleDuplicateFolder(folderName){
  const user = auth.currentUser;
  if(!user) return;
  let newName = folderName + ' (Salinan)';
  let suffix = 2;
  while(knownFolderNames.some(f => f.toLowerCase() === newName.toLowerCase())){
    newName = folderName + ' (Salinan ' + suffix + ')';
    suffix++;
  }
  try{
    await addDoc(collection(db, 'users', user.uid, 'folders'), { name: newName, createdAt: serverTimestamp() });
    /* ambil urutan rentetan asli, lalu simpan satu per satu dengan nomor order supaya susunan salinan sama persis */
    const timersInFolder = getFolderQueue(folderName);
    let stepNo = 1;
    for(const [, d] of timersInFolder){
      await addDoc(collection(db, 'users', user.uid, 'timers'), {
        name: d.name,
        folder: newName,
        category: d.category || '',
        durationSeconds: d.durationSeconds,
        remainingSeconds: d.durationSeconds,
        status: 'idle',
        endAt: null,
        createdAt: serverTimestamp(),
        soundType: d.soundType || 'chime',
        displayType: d.displayType || 'default',
        order: stepNo++
      });
    }
    currentFolder = newName;
  }catch(err){
    console.error(err);
    alert('Gagal menduplikat folder: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui'));
  }
}

/* jumlah folder yang memakai suatu kategori (folder eksplisit + folder dari timer aktif) */
function getCategoryFolderCount(name){
  const names = new Set();
  localFolders.forEach(d => { if(d.category === name) names.add(d.name); });
  localTimers.forEach(d => {
    if(d.category === name && d.status !== 'finished') names.add(d.folder || 'Umum');
  });
  return names.size;
}

async function renameCategory(oldName){
  const user = auth.currentUser;
  if(!user) return;
  const input = prompt('Ubah nama kategori:', oldName);
  if(input === null) return;
  const newName = input.trim();
  if(!newName || newName === oldName) return;
  if(knownCategoryNames.some(c => c.toLowerCase() === newName.toLowerCase())){
    alert('Kategori dengan nama itu sudah ada.');
    return;
  }
  try{
    const entry = Array.from(localCategories.entries()).find(([, d]) => d.name === oldName);
    if(entry){
      await updateDoc(doc(db, 'users', user.uid, 'categories', entry[0]), { name: newName });
    }
    const foldersToUpdate = Array.from(localFolders.entries()).filter(([, d]) => d.category === oldName);
    await Promise.all(foldersToUpdate.map(([id]) =>
      updateDoc(doc(db, 'users', user.uid, 'folders', id), { category: newName })
    ));
    const timersToUpdate = Array.from(localTimers.entries()).filter(([, d]) => d.category === oldName);
    await Promise.all(timersToUpdate.map(([id]) =>
      updateDoc(doc(db, 'users', user.uid, 'timers', id), { category: newName })
    ));
  }catch(err){
    console.error(err);
    alert('Gagal mengubah kategori: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui'));
  }
}

function pickLandscapeTimer(){
  const candidates = Array.from(localTimers.entries()).filter(([, d]) => d.status === 'running' || d.status === 'paused');
  if(!candidates.length){ lastLandscapeId = null; return null; }

  /* fitur multitasking: timer yang tersisa <1 menit jadi prioritas tampil besar,
     supaya pengguna diingatkan perpindahan step meski sedang lihat timer lain */
  const urgent = candidates
    .filter(([, d]) => d.status === 'running' && currentRemaining(d) > 0 && currentRemaining(d) <= 60)
    .sort((a, b) => currentRemaining(a[1]) - currentRemaining(b[1]))[0];
  if(urgent){
    lastLandscapeId = urgent[0];
    return urgent;
  }

  if(lastLandscapeId && localTimers.has(lastLandscapeId)){
    const d = localTimers.get(lastLandscapeId);
    if(d.status === 'running' || d.status === 'paused') return [lastLandscapeId, d];
  }
  const pick = candidates.find(([, d]) => d.status === 'running') || candidates[0];
  lastLandscapeId = pick[0];
  return pick;
}
function renderLandscapeCard(id, data){
  const remaining = currentRemaining(data);
  const pct = data.durationSeconds > 0 ? Math.min(100, Math.max(0, (remaining / data.durationSeconds) * 100)) : 0;
  const finished = data.status === 'finished';
  landscapeCard.dataset.id = id;
  landscapeCard.classList.toggle('finished', finished);
  landscapeBarFill.style.width = pct + '%';
  landscapeName.textContent = data.name;
  landscapeDigits.textContent = fmt(remaining);
  const lsVisual = document.getElementById('landscape-visual');
  const lsType = normalizeDisplayType(data.displayType);
  lsVisual.dataset.vtype = lsType;
  landscapeCard.classList.toggle('has-visual', lsType !== 'default');
  if(lsType === 'default'){
    lsVisual.style.display = 'none';
    lsVisual.innerHTML = '';
  }else{
    lsVisual.style.display = '';
    lsVisual.innerHTML = visualSVG(lsType, pct, data.status === 'running');
  }
  updateLandscapeFinishAll();

  /* fitur multitasking: tampilkan semua timer lain yang sedang berjalan sebagai daftar kecil,
     lengkap dengan tombol jeda/atur ulang masing-masing */
  const others = Array.from(localTimers.entries())
    .filter(([, cd]) => cd.status === 'running')
    .sort((a, b) => currentRemaining(a[1]) - currentRemaining(b[1]));
  landscapeMiniList.innerHTML = others.map(([cid, cd]) => `
    <div class="landscape-mini-item" data-id="${cid}">
      <span class="landscape-mini-name">${escapeHtml(cd.name)}</span>
      <span class="landscape-mini-digits">${fmt(currentRemaining(cd))}</span>
      <div class="landscape-mini-controls">
        <button class="ctrl-btn pause" data-action="pause" title="Jeda">${iconPause()}</button>
        <button class="ctrl-btn reset" data-action="reset" title="Atur ulang">${iconRotate()}</button>
      </div>
    </div>
  `).join('');
  landscapeMiniList.querySelectorAll('.landscape-mini-item').forEach(row => {
    const cid = row.dataset.id;
    const cd = localTimers.get(cid);
    if(!cd) return;
    const pauseBtn = row.querySelector('[data-action="pause"]');
    if(pauseBtn) pauseBtn.addEventListener('click', () => handlePause(cid, cd));
    const resetBtn = row.querySelector('[data-action="reset"]');
    if(resetBtn) resetBtn.addEventListener('click', () => handleReset(cid, cd));
  });

  const controlsHtml = `
    ${finished
      ? `<button class="ctrl-btn reset" data-action="reset" title="Ulangi">${iconReset()}</button>`
      : data.status === 'running'
        ? `<button class="ctrl-btn pause" data-action="pause" title="Jeda">${iconPause()}</button>`
        : `<button class="ctrl-btn play" data-action="play" title="Mulai">${iconPlay()}</button>`
    }
    ${finished ? '' : `<button class="ctrl-btn reset" data-action="reset" title="Atur ulang">${iconRotate()}</button>`}
  `;
  landscapeControls.innerHTML = controlsHtml;
  const playBtn = landscapeControls.querySelector('[data-action="play"]');
  if(playBtn) playBtn.addEventListener('click', () => handlePlay(id, data));
  const pauseBtn = landscapeControls.querySelector('[data-action="pause"]');
  if(pauseBtn) pauseBtn.addEventListener('click', () => handlePause(id, data));
  landscapeControls.querySelectorAll('[data-action="reset"]').forEach(btn => btn.addEventListener('click', () => handleReset(id, data)));
}
function updateLandscapeMode(){
  const isLandscape = window.matchMedia('(orientation: landscape)').matches;
  const wantFullscreen = isLandscape || manualFullscreenRequested;
  if(!isLandscape && !manualFullscreenRequested) landscapeDismissed = false;
  const candidate = (wantFullscreen && !landscapeDismissed) ? pickLandscapeTimer() : null;
  if(candidate){
    document.body.classList.add('landscape-fullscreen');
    renderLandscapeCard(candidate[0], candidate[1]);
  }else{
    document.body.classList.remove('landscape-fullscreen');
    manualFullscreenRequested = false;
  }
}
function closeLandscapeMode(){
  landscapeFocus = false;
  applyLandscapeFocus();
  landscapeDismissed = true;
  manualFullscreenRequested = false;
  const id = landscapeCard.dataset.id;
  const data = id ? localTimers.get(id) : null;
  if(comboFolders.size){
    comboFolders.forEach(f => resetFolderQueue(f));
    comboFolders = new Set();
  }else if(data){
    resetFolderQueue(data.folder || 'Umum');
  }
  lastLandscapeId = null;
  document.body.classList.remove('landscape-fullscreen');
}

/* klik judul folder -> langsung bisa diketik untuk ganti nama */
folderDetailTitle.title = 'Klik untuk ganti nama';
folderDetailTitle.addEventListener('click', () => {
  if(folderTitleEditing || folderListView || !currentFolder) return;
  const oldName = currentFolder;
  folderTitleEditing = true;
  folderDetailTitle.classList.add('editing');
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'folder-title-input';
  input.value = oldName;
  input.autocomplete = 'off';
  folderDetailTitle.textContent = '';
  folderDetailTitle.appendChild(input);
  input.focus();
  input.select();

  let done = false;
  const finish = async (save) => {
    if(done) return;
    done = true;
    const newName = input.value.trim();
    folderTitleEditing = false;
    folderDetailTitle.classList.remove('editing');
    folderDetailTitle.textContent = oldName;
    if(!save || !newName || newName === oldName){ return; }
    const clash = knownFolderNames.some(f => f.toLowerCase() === newName.toLowerCase() && f.toLowerCase() !== oldName.toLowerCase());
    if(clash){
      alert('Folder dengan nama itu sudah ada.');
      return;
    }
    try{
      folderDetailTitle.textContent = newName;
      await renameFolder(oldName, newName);
      currentFolder = newName;
      renderAll();
    }catch(err){
      console.error(err);
      folderDetailTitle.textContent = oldName;
      alert('Gagal mengganti nama folder: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui'));
    }
  };
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
    else if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
  });
  input.addEventListener('blur', () => finish(true));
});

function friendlyFirestoreError(err){
  const code = err && err.code;
  if(code === 'permission-denied'){
    return 'Ditolak oleh Firestore Rules. Pastikan Rules sudah diatur agar user boleh menulis ke koleksi timernya sendiri (lihat README).';
  }
  if(code === 'unavailable' || code === 'failed-precondition'){
    return 'Firestore Database sepertinya belum dibuat untuk project ini. Buat database di Firebase Console (Firestore Database → Create database).';
  }
  if(code === 'unauthenticated'){
    return 'Sesi login sudah tidak valid. Coba keluar lalu masuk lagi.';
  }
  return 'Gagal menambah timer: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui') + '. Cek Console browser (F12) untuk detail.';
}

addTimerBtn.addEventListener('click', async () => {
  hideComposerMsg();
  const user = auth.currentUser;
  if(!user){
    showComposerMsg('Kamu belum masuk. Muat ulang halaman dan masuk lagi.', 'error');
    return;
  }
  const name = timerNameInput.value.trim() || 'Timer';
  const totalSec = minutesToSeconds(durMinInput.value);
  if(totalSec <= 0){
    showComposerMsg('Atur durasi menit lebih dari 0 dulu.', 'error');
    durMinInput.focus();
    return;
  }
  let folder = timerFolderInput.value.trim();
  if(!folder){
    showComposerMsg('Isi nama kegiatan dulu.', 'error');
    timerFolderInput.focus();
    return;
  }
  const category = timerCategoryInput.value.trim();
  if(!category){
    showComposerMsg('Isi jenis kategori dulu.', 'error');
    timerCategoryInput.focus();
    return;
  }
  const rentetanSteps = Array.from(rentetanList.querySelectorAll('.rentetan-item')).map((item, i) => {
    const stepSec = minutesToSeconds(item.querySelector('.rentetan-minutes-input').value);
    const stepName = item.querySelector('.rentetan-name-input').value.trim() || `Rentetan ${i + 1}`;
    return { name: stepName, durationSeconds: stepSec };
  }).filter(step => step.durationSeconds > 0);
  const isChain = rentetanSteps.length > 0;
  const isFolderInsert = !editingId && stepOrderField.style.display !== 'none';
  const startsIdle = true; // timer baru selalu masuk dulu ke daftar (idle), tidak auto mulai
  addTimerBtn.disabled = true;
  try{
    if(category && !knownCategoryNames.includes(category)){
      await addDoc(collection(db, 'users', user.uid, 'categories'), { name: category, createdAt: serverTimestamp() });
    }
    await syncFolderCategory(folder, category);
    let insertOrder = null;
    if(isFolderInsert){
      const totalNew = 1 + rentetanSteps.length;
      const desired = parseInt(stepOrderInput.value, 10);
      insertOrder = await shiftFolderQueueForInsert(folder, desired, totalNew);
    }
    if(editingId){
      await updateDoc(doc(db, 'users', user.uid, 'timers', editingId), {
        name,
        folder,
        category,
        durationSeconds: totalSec,
        remainingSeconds: totalSec,
        status: 'idle',
        endAt: null,
        soundType: selectedSoundType,
        displayType: selectedDisplayType
      });
    }else{
      await addDoc(collection(db, 'users', user.uid, 'timers'), {
        name,
        folder,
        category,
        durationSeconds: totalSec,
        remainingSeconds: totalSec,
        status: startsIdle ? 'idle' : 'running',
        endAt: startsIdle ? null : Date.now() + totalSec * 1000,
        createdAt: serverTimestamp(),
        soundType: selectedSoundType,
        displayType: selectedDisplayType,
        ...(insertOrder !== null ? { order: insertOrder } : {})
      });
    }
    let stepOrderCounter = insertOrder !== null ? insertOrder + 1 : null;
    for(const step of rentetanSteps){
      await addDoc(collection(db, 'users', user.uid, 'timers'), {
        name: step.name,
        folder,
        category,
        durationSeconds: step.durationSeconds,
        remainingSeconds: step.durationSeconds,
        status: 'idle', // menunggu giliran, otomatis lanjut lewat maybeStartNextInFolder
        endAt: null,
        createdAt: serverTimestamp(),
        soundType: selectedSoundType,
        displayType: selectedDisplayType,
        ...(stepOrderCounter !== null ? { order: stepOrderCounter } : {})
      });
      if(stepOrderCounter !== null) stepOrderCounter++;
    }
    timerNameInput.value = '';
    resetRentetanList();
    currentFolder = folder;
    closeAddModal();
    if(isChain){
      switchToTab('folders');
      openFolderDetail(folder);
    }
  }catch(err){
    console.error(err);
    showComposerMsg(friendlyFirestoreError(err), 'error');
  }finally{
    addTimerBtn.disabled = false;
  }
});

/* ---------------- firestore sync ---------------- */
function subscribeTimers(uid){
  const q = query(collection(db, 'users', uid, 'timers'), orderBy('createdAt', 'desc'));
  unsubscribeTimers = onSnapshot(q, (snap) => {
    localTimers.clear();
    snap.forEach(docSnap => {
      localTimers.set(docSnap.id, docSnap.data());
    });
    renderAll();
    if(window.__splash) window.__splash.mark('data');
  }, (err) => {
    console.error(err);
    if(window.__splash) window.__splash.mark('data');
    showComposerMsg(friendlyFirestoreError(err), 'error');
  });
}

function subscribeFolders(uid){
  const q = collection(db, 'users', uid, 'folders');
  unsubscribeFolders = onSnapshot(q, (snap) => {
    localFolders.clear();
    snap.forEach(docSnap => {
      localFolders.set(docSnap.id, docSnap.data());
    });
    renderAll();
  }, (err) => {
    console.error(err);
  });
}

function subscribeCategories(uid){
  const q = collection(db, 'users', uid, 'categories');
  unsubscribeCategories = onSnapshot(q, (snap) => {
    localCategories.clear();
    snap.forEach(docSnap => {
      localCategories.set(docSnap.id, docSnap.data());
    });
    knownCategoryNames = Array.from(localCategories.values()).map(c => c.name).sort();
    populateCategorySelect();
    renderCategoryManageList();
    renderAll();
  }, (err) => {
    console.error(err);
  });
}

/* ---------------- input durasi: satuan menit, boleh desimal (0,5 = 30 detik) ---------------- */
function minutesToSeconds(value){
  const n = Number(String(value == null ? '' : value).trim().replace(',', '.'));
  if(!isFinite(n) || n <= 0) return 0;
  return Math.round(n * 60);
}
function secondsToMinutesText(sec){
  const m = (sec || 0) / 60;
  if(Number.isInteger(m)) return String(m);
  return String(parseFloat(m.toFixed(4))).replace('.', ',');
}
function formatTotalSeconds(total){
  const t = Math.max(0, Math.round(total));
  const h = Math.floor(t / 3600);
  const m = Math.floor((t % 3600) / 60);
  const sc = t % 60;
  const parts = [];
  if(h) parts.push(`${h} jam`);
  if(m) parts.push(`${m} menit`);
  if(sc) parts.push(`${sc} detik`);
  return parts.length ? parts.join(' ') : '0 menit';
}

function fmt(totalSeconds){
  const s = Math.max(0, Math.round(totalSeconds));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
}

function currentRemaining(data){
  if(data.status === 'running' && data.endAt){
    const endMs = data.endAt.toMillis ? data.endAt.toMillis() : data.endAt;
    return Math.max(0, (endMs - Date.now()) / 1000);
  }
  return data.remainingSeconds;
}

function timestampMs(data){
  return data.createdAt && data.createdAt.toMillis ? data.createdAt.toMillis() : 0;
}

function getFolderQueue(folderName){
  return Array.from(localTimers.entries())
    .filter(([, d]) => (d.folder || 'Umum') === folderName)
    .sort((a, b) => {
      const oa = (a[1].order === undefined || a[1].order === null) ? Infinity : a[1].order;
      const ob = (b[1].order === undefined || b[1].order === null) ? Infinity : b[1].order;
      if(oa !== ob) return oa - ob;
      return timestampMs(a[1]) - timestampMs(b[1]);
    });
}

/* ---------------- estimasi jam selesai (gabung timer) ---------------- */
/* sisa detik seluruh step yang belum selesai di satu folder (step berjalan berurutan) */
function folderRemainingSeconds(folderName){
  return getFolderQueue(folderName).reduce((sum, [, d]) => {
    if(d.status === 'finished') return sum;
    return sum + (currentRemaining(d) || 0);
  }, 0);
}
/* folder berjalan paralel, jadi selesai keseluruhan = folder dengan sisa waktu terlama */
function estimateFinishMs(folderNames){
  let maxSec = 0;
  folderNames.forEach(f => { maxSec = Math.max(maxSec, folderRemainingSeconds(f)); });
  return Date.now() + maxSec * 1000;
}
function formatClock(ms){
  const d = new Date(ms);
  const hhmm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const now = new Date();
  const sameDay = d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
  return sameDay ? hhmm : hhmm + ' (besok)';
}

// Geser urutan langkah yang sudah ada di folder supaya timer baru bisa disisipkan
// di posisi manapun (bukan cuma di akhir). Menomori ulang seluruh antrean folder
// dengan field `order` eksplisit, lalu mengembalikan posisi (1-based) untuk item baru.
async function shiftFolderQueueForInsert(folder, desiredPosition, countNew){
  const user = auth.currentUser;
  const queue = getFolderQueue(folder);
  const maxPos = queue.length + 1;
  const clamped = Math.min(Math.max(1, desiredPosition || maxPos), maxPos);
  const updates = queue.map(([id], i) => {
    const origPos = i + 1;
    const newPos = origPos >= clamped ? origPos + countNew : origPos;
    return updateDoc(doc(db, 'users', user.uid, 'timers', id), { order: newPos });
  });
  await Promise.all(updates);
  return clamped;
}

function renderAll(){

  const all = Array.from(localTimers.entries());

  const running = all.filter(([, d]) => d.status === 'running');

  /* folders: distinct folder names from active timers + explicitly-created empty folders */
  const explicitFolderNames = Array.from(localFolders.values()).map(f => f.name);
  const folderNames = Array.from(new Set([
    ...active.map(([, d]) => d.folder || 'Umum'),
    ...explicitFolderNames
  ])).sort();

    currentFolder = '';
    folderListView = true;

    ...all.map(([, d]) => d.folder || 'Umum'),

               <button class="folder-search-clear" id="folder-search-clear" type="button" title="Tutup">${iconCloseSmall()}</button>
             </div>`
          : ''
        ) +
        `<button class="folder-chip-add" id="add-folder-chip" type="button" title="Tambah folder">+</button>` +
        `<button class="folder-multitask-btn" id="multitask-toggle-btn" type="button" title="Gabung timer (multitasking)">${iconLayersSmall()}</button>` +

              const hasPaused = queue.some(([, d]) => d.status === 'paused');
              const canStart = queue.length > 0 && (hasIdle || hasPaused) && !anyRunning;
              const totalSeconds = queue.reduce((sum, [, d]) => sum + (d.durationSeconds || 0), 0);

                </div>
              </div>
            `;
            };
            const pinnedFolders = searchedFolderNames.filter(f => isFolderPinned(f));
            const priorityFolders = searchedFolderNames.filter(f => !isFolderPinned(f) && isFolderPriority(f));
            const otherFolders = searchedFolderNames.filter(f => !isFolderPinned(f) && !isFolderPriority(f));
            return (
              (pinnedFolders.length ? `<div class="folder-section-label">Disematkan</div>` + pinnedFolders.map(buildRow).join('') : '') +
              (priorityFolders.length ? `<div class="folder-section-label">Prioritas</div>` + priorityFolders.map(buildRow).join('') : '') +
              (otherFolders.length ? ((pinnedFolders.length || priorityFolders.length) ? `<div class="folder-section-label">Semua folder</div>` : '') + otherFolders.map(buildRow).join('') : '')
            );
          })());
    folderChipsRow.querySelectorAll('.folder-chip').forEach(chip => {
      chip.addEventListener('click', () => openFolderDetail(chip.dataset.folder));
    });
    /* klik nama folder di daftar -> langsung bisa diketik untuk ganti nama */
    folderChipsRow.querySelectorAll('.folder-chip-label').forEach(label => {
      label.addEventListener('click', (e) => {
        e.stopPropagation();
        if(folderListRenaming) return;
        const oldName = label.dataset.folder;
        folderListRenaming = true;
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'folder-title-input';
        input.value = oldName;
        input.autocomplete = 'off';
        label.replaceWith(input);
        input.focus();
        input.select();
        let done = false;
        const finish = async (save) => {
          if(done) return;
          done = true;
          const newName = input.value.trim();
          folderListRenaming = false;
          if(save && newName && newName !== oldName){
            const clash = knownFolderNames.some(f => f.toLowerCase() === newName.toLowerCase() && f.toLowerCase() !== oldName.toLowerCase());
            if(clash){
              alert('Folder dengan nama itu sudah ada.');
            }else{
              try{
                await renameFolder(oldName, newName);
                if(currentFolder === oldName) currentFolder = newName;
              }catch(err){
                console.error(err);
                alert('Gagal mengganti nama folder: ' + (err && err.message ? err.message : 'kesalahan tidak diketahui'));
              }
            }
          }
          renderAll();
        };
        input.addEventListener('click', ev => ev.stopPropagation());
        input.addEventListener('keydown', (ev) => {
          if(ev.key === 'Enter'){ ev.preventDefault(); finish(true); }
          else if(ev.key === 'Escape'){ ev.preventDefault(); finish(false); }
        });
        input.addEventListener('blur', () => finish(true));
      });
    });
    /* ketuk bagian lain dari baris folder (area kosong, badge, total waktu) -> buka isi folder */
    folderChipsRow.querySelectorAll('.folder-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if(e.target.closest('button, input')) return;
        openFolderDetail(row.dataset.folder);
      });
    });
    folderChipsRow.querySelectorAll('[data-folder-action]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = btn.dataset.folderAction;
        const folderName = btn.dataset.folder;
        if(action === 'edit') openEditFolderModal(folderName);
        else if(action === 'duplicate') handleDuplicateFolder(folderName);
        else if(action === 'start') runFolderSequence(folderName);
        else if(action === 'toggle-pin') toggleFolderPinned(folderName);
        else if(action === 'toggle-priority') toggleFolderPriority(folderName);
      });
    });
    document.getElementById('add-folder-chip').addEventListener('click', openNewFolderModal);
    const multitaskToggleBtn = document.getElementById('multitask-toggle-btn');
    if(multitaskToggleBtn){
      multitaskToggleBtn.addEventListener('click', openMultitaskModal);
    }
    const folderFullscreenBtn = document.getElementById('folder-fullscreen-btn');
    if(folderFullscreenBtn){
      folderFullscreenBtn.addEventListener('click', () => {
        if(folderFullscreenBtn.disabled) return;
        landscapeDismissed = false;
        manualFullscreenRequested = true;
        updateLandscapeMode();
      });
    }

    folderChipsRow.querySelectorAll('.category-filter-option').forEach(chip => {
      chip.addEventListener('click', (e) => {
        const delBtn = e.target.closest('.category-chip-del');
        if(delBtn){
          e.stopPropagation();
          deleteCategory(delBtn.dataset.del);
          return;
        }
        const cat = chip.dataset.category;
        if(!cat){
          if(hiddenCategories.size === 0){
            knownCategoryNames.forEach(c => hiddenCategories.add(c));
          }else{
            hiddenCategories.clear();
          }
        }else if(hiddenCategories.has(cat)){
          hiddenCategories.delete(cat);
        }else{
          hiddenCategories.add(cat);
        }
        renderAll();
      });
    });

    const folderFilterBtn = document.getElementById('folder-filter-btn');
    if(folderFilterBtn){
      folderFilterBtn.addEventListener('click', () => {
        if(categoryFilterOpen){
          closeCategoryFilter();
        }else{
          /* saat dibuka, semua centang dikosongkan supaya bisa langsung pilih kategori yang dituju */
          categoryFilterOpen = true;
          hiddenCategories = new Set(knownCategoryNames);
        }
        renderAll();
      });
    }

    const folderSearchBtn = document.getElementById('folder-search-btn');
    if(folderSearchBtn){
      folderSearchBtn.addEventListener('click', () => {
        folderSearchOpen = !folderSearchOpen;
        if(!folderSearchOpen) folderSearchQuery = '';
        renderAll();
        if(folderSearchOpen){
          const input = document.getElementById('folder-search-input');
          if(input) input.focus();
        }
      });
    }
    const folderSearchInput = document.getElementById('folder-search-input');
    if(folderSearchInput){
      folderSearchInput.addEventListener('input', (e) => {
        folderSearchQuery = e.target.value;
        renderAll();
        const refocused = document.getElementById('folder-search-input');
        if(refocused){
          refocused.focus();
          const pos = refocused.value.length;
          refocused.setSelectionRange(pos, pos);
        }
      });
    }
    const folderSearchClear = document.getElementById('folder-search-clear');
    if(folderSearchClear){
      folderSearchClear.addEventListener('click', () => {
        folderSearchOpen = false;
        folderSearchQuery = '';
        renderAll();
      });
    }

    if(!folderListView){
      if(!folderTitleEditing) folderDetailTitle.textContent = currentFolder;
      folderDeleteBtn.style.display = '';
      const queue = getFolderQueue(currentFolder);
      const stepMap = new Map(queue.map(([id], i) => [id, i + 1]));
      const orderedVisible = queue.filter(([, d]) => d.status !== 'finished');
      if(reorderDragging){ reorderPendingRender = true; }
      else renderList(folderTimerList, orderedVisible, '', stepMap);
    }
  }
}

function buildCard(id, data, stepLabel){
  const compact = !!stepLabel;
  const remaining = currentRemaining(data);
  // Kartu langkah di antrean folder (compact) menampilkan durasi bulat seperti
  // semula diatur untuk status idle/dijeda — hanya langkah yang benar-benar
  // sedang berjalan yang menunjukkan hitungan mundur langsung.
  const displaySeconds = (compact && (data.status === 'idle' || data.status === 'paused'))
    ? data.durationSeconds
    : remaining;
  const pct = data.durationSeconds > 0 ? Math.min(100, Math.max(0, (displaySeconds / data.durationSeconds) * 100)) : 0;
  const finished = data.status === 'finished';

  const card = document.createElement('div');
  card.className = 'timer-card' + (compact ? ' timer-card-compact' : '') + (finished ? ' finished' : '');
  card.dataset.id = id;

  const statusLabel = compact
    ? {
        idle: '',
        running: '',
        paused: '',
        finished: 'Selesai'
      }[data.status] || ''
    : {
        idle: 'Siap',
        running: 'Berjalan',
        paused: 'Dijeda',
        finished: 'Selesai'
      }[data.status] || '';

  const vType = normalizeDisplayType(data.displayType);
  const visualHtml = vType === 'default'
    ? ''
    : `<div class="mini-visual" data-role="visual" data-vtype="${vType}">${visualSVG(vType, pct, data.status === 'running')}</div>`;
  const digitsWrapHtml = `
    ${visualHtml}
    <div class="timer-digits" data-role="digits">${fmt(displaySeconds)}</div>
  `;
  const controlsHtml = `
    ${finished
      ? `<button class="ctrl-btn reset" data-action="reset" title="Ulangi">${iconReset()}</button>`
      : data.status === 'running'
        ? `<button class="ctrl-btn pause" data-action="pause" title="Jeda">${iconPause()}</button>`
        : compact ? '' : `<button class="ctrl-btn play" data-action="play" title="Mulai">${iconPlay()}</button>`
    }
    ${compact ? '' : `<button class="ctrl-btn reset" data-action="reset" title="Atur ulang">${iconRotate()}</button>`}
  `;
  const editDeleteHtml = `
    <button class="edit-btn" title="Edit" data-action="edit">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
    </button>
    <button class="delete-btn" title="Hapus" data-action="delete">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </button>
  `;

  card.innerHTML = compact ? `
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="timer-top compact">
      ${stepLabel ? `<span class="step-number">${escapeHtml(stepLabel)}</span>` : ''}
      <div class="timer-name">${escapeHtml(data.name)}${data.category ? `<span class="category-badge">${escapeHtml(data.category)}</span>` : ''}${statusLabel ? `<span class="status">${statusLabel}</span>` : ''}</div>
      <div class="timer-digits-wrap">${digitsWrapHtml}</div>
      <div class="card-actions">${editDeleteHtml}</div>
    </div>
    ${controlsHtml.trim() ? `<div class="timer-controls compact">${controlsHtml}</div>` : ''}
  ` : `
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="timer-top">
      <div class="timer-name">${escapeHtml(data.name)}<span class="status"><span class="folder-badge">${escapeHtml(data.folder || 'Umum')}</span>${data.category ? `<span class="category-badge">${escapeHtml(data.category)}</span>` : ''}${statusLabel}</span></div>
      <div class="card-actions">${editDeleteHtml}</div>
    </div>
    <div class="timer-mid">
      <div class="timer-digits-wrap">${digitsWrapHtml}</div>
      <div class="timer-controls">${controlsHtml}</div>
    </div>
  `;

  card.querySelector('[data-action="delete"]').addEventListener('click', () => handleDelete(id));
  card.querySelector('[data-action="edit"]').addEventListener('click', () => openEditModal(id, data));
  const playBtn = card.querySelector('[data-action="play"]');
  if(playBtn) playBtn.addEventListener('click', () => handlePlay(id, data));
  const pauseBtn = card.querySelector('[data-action="pause"]');
  if(pauseBtn) pauseBtn.addEventListener('click', () => handlePause(id, data));
  card.querySelectorAll('[data-action="reset"]').forEach(btn => btn.addEventListener('click', () => handleReset(id, data)));

  return card;
}

/* ---------------- timer actions ---------------- */
async function handlePlay(id, data){
  const user = auth.currentUser;
  if(!user) return;
  const remaining = currentRemaining(data) > 0 ? currentRemaining(data) : data.durationSeconds;
  const endAt = Date.now() + remaining * 1000;
  await updateDoc(doc(db, 'users', user.uid, 'timers', id), {
    status: 'running',
    endAt,
    remainingSeconds: remaining
  });
}

/* start the next never-started timer in the same folder, following queue order */
async function maybeStartNextInFolder(folderName, finishedId){
  const queue = getFolderQueue(folderName);
  const idx = queue.findIndex(([id]) => id === finishedId);
  if(idx === -1) return;
  const next = queue.slice(idx + 1).find(([, d]) => d.status === 'idle');
  if(next) await handlePlay(next[0], next[1]);
}

function runFolderSequence(folderName){
  const queue = getFolderQueue(folderName);
  const anyRunning = queue.some(([, d]) => d.status === 'running');
  if(anyRunning) return;
  const paused = queue.find(([, d]) => d.status === 'paused');
  if(paused){
    manualFullscreenRequested = true;
    landscapeDismissed = false;
    handlePlay(paused[0], paused[1]);
    return;
  }
  const first = queue.find(([, d]) => d.status === 'idle');
  if(first){
    manualFullscreenRequested = true;
    landscapeDismissed = false;
    handlePlay(first[0], first[1]);
  }
}

function renderMultitaskList(){
  const q = multitaskSearchQuery.trim().toLowerCase();
  const names = knownFolderNames.filter(f => !q || f.toLowerCase().includes(q));
  multitaskFolderListEl.innerHTML = names.length === 0
    ? `<div class="folder-search-empty">Tidak ada folder yang cocok.</div>`
    : names.map(f => {
        const checked = multitaskSelected.has(f);
        const queue = getFolderQueue(f);
        const totalSeconds = queue.reduce((sum, [, d]) => sum + (d.durationSeconds || 0), 0);
        const remainSec = folderRemainingSeconds(f);
        return `
        <div class="multitask-modal-row${checked ? ' checked' : ''}" data-folder="${escapeHtml(f)}">
          <span class="folder-row-check${checked ? ' checked' : ''}">${checked ? iconCheckSmall() : ''}</span>

          <span class="multitask-modal-right">
            <span class="folder-row-total">${fmt(totalSeconds)}</span>
            ${remainSec > 0 ? `<span class="multitask-modal-finish" data-finish-folder="${escapeHtml(f)}">selesai ${formatClock(Date.now() + remainSec * 1000)}</span>` : ''}
          </span>
        </div>`;
      }).join('');
  multitaskFolderListEl.querySelectorAll('.multitask-modal-row').forEach(row => {
    row.addEventListener('click', () => {
      const f = row.dataset.folder;
      if(multitaskSelected.has(f)) multitaskSelected.delete(f);
      else multitaskSelected.add(f);
      renderMultitaskList();
    });
  });
  updateMultitaskSummary();
  multitaskGoBtnEl.disabled = multitaskSelected.size < 2;
  multitaskGoBtnEl.textContent = multitaskSelected.size ? `Go (${multitaskSelected.size})` : 'Go';
}

function startMultitaskCombo(){
  if(multitaskSelected.size < 2) return;
  const folders = Array.from(multitaskSelected);
  comboFolders = new Set(folders);
  lastLandscapeId = null;
  folders.forEach(f => {
    const queue = getFolderQueue(f);
    const anyRunning = queue.some(([, d]) => d.status === 'running');
    if(anyRunning) return;
    const paused = queue.find(([, d]) => d.status === 'paused');
    const next = paused || queue.find(([, d]) => d.status === 'idle');
    if(next) handlePlay(next[0], next[1]);
  });
  multitaskSelected.clear();
  closeMultitaskModal();
  manualFullscreenRequested = true;
  landscapeDismissed = false;
  renderAll();
}
